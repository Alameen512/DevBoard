<div class="mb-3">
  <label class="form-label">Title</label>
  <input type="text" name="title" class="form-control" value="{{ task.title|default:'' }}" placeholder="e.g. Fix sidebar collapse bug" required>
</div>
<div class="mb-3">
  <label class="form-label">Description</label>
  <textarea name="description" class="form-control" rows="2" placeholder="Optional details">{{ task.description|default:'' }}</textarea>
</div>
<div class="mb-3">
  <label class="form-label">Project</label>
  <select name="project" class="form-select">
    <option value="">No project</option>
    {% for proj in user_projects %}
      <option value="{{ proj.id }}" {% if task.project_id == proj.id %}selected{% endif %}>{{ proj.name }}</option>
    {% endfor %}
  </select>
</div>
<div class="row">
  <div class="col-6 mb-3">
    <label class="form-label">Priority</label>
    <select name="priority" class="form-select">
      <option value="low" {% if task.priority == 'low' %}selected{% endif %}>Low</option>
      <option value="medium" {% if task.priority == 'medium' or not task.priority %}selected{% endif %}>Medium</option>
      <option value="high" {% if task.priority == 'high' %}selected{% endif %}>High</option>
    </select>
  </div>
  <div class="col-6 mb-3">
    <label class="form-label">Status</label>
    <select name="status" class="form-select">
      <option value="todo" {% if task.status == 'todo' or not task.status %}selected{% endif %}>Todo</option>
      <option value="in_progress" {% if task.status == 'in_progress' %}selected{% endif %}>In Progress</option>
      <option value="completed" {% if task.status == 'completed' %}selected{% endif %}>Completed</option>
    </select>
  </div>
</div>
<div class="mb-1">
  <label class="form-label">Due Date</label>
  <input type="date" name="due_date" class="form-control" value="{{ task.due_date|date:'Y-m-d'|default:'' }}">
</div>
